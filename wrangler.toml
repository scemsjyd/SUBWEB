name = "subweb"
pages_build_output_dir = "dist"
compatibility_date = "2024-04-01"

[vars]
# 原来 [functions.env] 或 [build.environment] 里的变量移到这里
# NODE_VERSION 通常在 Cloudflare 控制台的环境变量里设置，或者在 .node-version 文件里定义
# NODE_VERSION = "18"
# MY_SECRET = "your-secret-value"

# 注意：Pages 不需要 [build] 块来指定 command，
# 构建命令应该在 Cloudflare Pages 的 Dashboard 后台设置。
[assets]
directory = "./dist"